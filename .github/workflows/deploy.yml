name: Deploy
on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Secrets
        env:
          SECRET_FILE: blog/.vitepress/secret.ts
        run: |
          echo "export const ALGOLIA_ID = '${{ secrets.ALGOLIA_ID }}';"      >> ${SECRET_FILE}
          echo "export const ALGOLIA_SECRET = '${{ secrets.ALGOLIA_SECRET }}';"  >> ${SECRET_FILE}

      - uses: actions/setup-node@v4
        with:
          node-version: '18.13.0'

      - uses: pnpm/action-setup@v4
        name: Install pnpm
        id: pnpm-install
        with:
          version: 9.15.9
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v4
        name: Setup pnpm cache
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the project
        run: pnpm build

      - name: Deploy
        # pinned to a commit SHA: this action receives API_TOKEN_GITHUB, so a
        # mutable branch ref would be a supply-chain path to that credential
        uses: cpina/github-action-push-to-another-repository@55306faa4ed53b815ae49e564af8cfb359d32ae2 # v1.7.3
        env:
          API_TOKEN_GITHUB: ${{ secrets.API_TOKEN_GITHUB }}
        with:
          source-directory: "blog/.vitepress/dist"
          destination-github-username: "Forsworns"
          destination-repository-name: "Forsworns.github.io"
          user-email: ${{ secrets.MAIL }}
          target-branch: master
